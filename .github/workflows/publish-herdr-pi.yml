name: Publish toolbox-herdr-pi Container

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    paths:
      - 'herdr/pi/**'
      - '.github/workflows/publish-herdr-pi.yml'
  workflow_dispatch:

# Cancel superseded runs (e.g. new commit on the same PR) to free runners.
# Cache uploads from cancelled runs may be lost; tag releases are unaffected
# because each tag has its own concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The publish job escalates to packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/toolbox-herdr-pi

jobs:
  # ------------------------------------------------------------------
  # Build (no publish)
  #
  # Runs on PRs and manual dispatches. Builds both platforms without
  # logging in or pushing, so PRs can never publish an image. The GHA
  # layer cache is warmed here so tag releases start fast.
  # ------------------------------------------------------------------
  build:
    name: Build (warm cache)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and warm GHA cache
        uses: docker/build-push-action@v5
        with:
          context: ./herdr/pi
          file: ./herdr/pi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Publish
  #
  # Only runs on 'v*' tag pushes to this repository. Logs in with the
  # short-lived GITHUB_TOKEN (no long-lived secrets), and attaches SBOM
  # and provenance attestations to the published image.
  # ------------------------------------------------------------------
  publish:
    name: Build and publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./herdr/pi
          file: ./herdr/pi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
