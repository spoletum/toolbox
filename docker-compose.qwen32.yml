# Apply after the model download completes:
# docker compose -f docker-compose.yml -f docker-compose.qwen32.yml up -d --no-deps llama
# Roll back: docker compose -f docker-compose.yml up -d --no-deps llama
services:
  llama:
    command:
      - --model
      - /models/Qwen_Qwen3-32B-Q6_K.gguf
      - --alias
      # Keep the existing API model ID so existing clients remain compatible.
      - qwen3-coder-30b-a3b-q6-k
      - --ctx-size
      - "32768"
      - --gpu-layers
      - "999"
      - --parallel
      - "1"
      - --jinja
      - --reasoning
      - "on"
      - --reasoning-format
      - deepseek
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
